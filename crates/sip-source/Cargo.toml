[package]
name = "sip-source"
version.workspace = true
edition.workspace = true

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = "0.4"
chrono-tz = "0.10"
flate2 = "1"
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = "9"
libc = "0.2"
mime_guess = "2"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "mysql", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "time"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v5", "serde"] }

# sip-source with its own MariaDB. Captured data is kept in the sip-source-data volume
# until you add a ClickHouse server under Admin -> Storage.
#
#   cp .env.compose.example .env      # then set the passwords
#   docker compose up -d
#
# Every VP_* variable is described in docs/ENVIRONMENT.md.
services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: voip_panel
      MARIADB_USER: voip_panel
      MARIADB_PASSWORD: ${VP_DB_PASSWORD:?set VP_DB_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  sip-source:
    image: ntuxa76/sip-source:0.3
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      VP_DB_HOST: mariadb
      VP_DB_USER: voip_panel
      VP_DB_PASSWORD: ${VP_DB_PASSWORD}
      VP_SECRET_KEY: ${VP_SECRET_KEY:-}
      VP_SETUP_TOKEN: ${VP_SETUP_TOKEN:-}
      # Add any other VP_* variable here, for example:
      # VP_DEFAULT_TZ: Asia/Baghdad
      # VP_HEP_AUTH_KEY: change-me
    volumes:
      - sip-source-data:/data
    ports:
      - "${VP_PORT:-8080}:8080"
      - "${VP_HEP_PORT:-9060}:9060/udp"
      - "${VP_HEP_PORT:-9060}:9060/tcp"

volumes:
  mariadb-data:
  sip-source-data:

# sip-source with its own MariaDB. Captured data is kept in the sip-source-data volume
# until you add a ClickHouse server under Admin -> Storage.
#
#   cp .env.compose.example .env      # then set the passwords
#   docker compose up -d
#
# Every SS_* variable is described in docs/ENVIRONMENT.md.
services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: voip_panel
      MARIADB_USER: voip_panel
      MARIADB_PASSWORD: ${SS_DB_PASSWORD:?set SS_DB_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  sip-source:
    image: ntuxa76/sip-source:0.9.1
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      SS_DB_HOST: mariadb
      SS_DB_USER: voip_panel
      SS_DB_PASSWORD: ${SS_DB_PASSWORD}
      SS_SECRET_KEY: ${SS_SECRET_KEY:-}
      SS_SETUP_TOKEN: ${SS_SETUP_TOKEN:-}
      # Add any other SS_* variable here, for example:
      # SS_DEFAULT_TZ: Asia/Baghdad
      # SS_HEP_AUTH_KEY: change-me
    volumes:
      - sip-source-data:/data
    ports:
      - "${SS_PORT:-8080}:8080"
      - "${SS_HEP_PORT:-9060}:9060/udp"
      - "${SS_HEP_PORT:-9060}:9060/tcp"

volumes:
  mariadb-data:
  sip-source-data:
